<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>MONK MODE — 30 DAYS</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#0b1020;color:#f3f4f6}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:22px 16px 100px}h1{font-size:25px;margin:0}h2{font-size:17px;margin:0 0 14px}.muted{color:#a8b2c7;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.tag{background:#25314b;border-radius:20px;padding:7px 11px;font-size:12px}.card{background:#151d30;border:1px solid #2a354d;border-radius:18px;padding:18px;margin-top:15px}.big{font-size:36px;font-weight:800}.meter{height:10px;background:#303a50;border-radius:10px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#7dd3a7;transition:width .2s}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stats>div{background:#202b42;border-radius:12px;padding:12px 4px}.stats strong{display:block;font-size:21px}.section-head{display:flex;justify-content:space-between;align-items:center}.item{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #29354a}.item:last-child{border:0}input[type=checkbox]{width:23px;height:23px;accent-color:#7dd3a7;flex-shrink:0}.item span{flex:1}button,input,textarea,select{font:inherit}button{background:#283954;border:1px solid #3a4e6e;color:#fff;border-radius:11px;padding:10px 13px;cursor:pointer}button.primary{background:#76cfa5;color:#0b1723;border-color:#76cfa5;font-weight:700}button.small{padding:6px 9px;font-size:12px}button.danger{color:#ffb4b4}input[type=text],input[type=date],textarea,select{width:100%;background:#0e1729;border:1px solid #34435e;border-radius:10px;color:#fff;padding:12px}textarea{min-height:80px;resize:vertical}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.row input{flex:1}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{padding:10px 0;text-align:center;border-radius:10px;background:#28354d;border:1px solid transparent;font-size:13px}.day.today{border-color:#7dd3a7}.day.full{background:#245744}.day.partial{background:#65522d}.day.future{opacity:.45}.day.selected{outline:2px solid #fff}.hint{font-size:12px;color:#9caac2}.toolbar{display:flex;flex-wrap:wrap;gap:8px}.hidden{display:none}footer{color:#7d8ba4;font-size:12px;text-align:center;margin-top:24px}</style></head><body><main>
<div class="top"><div><div class="muted">30 DAY DISCIPLINE CHALLENGE</div><h1>MONK MODE</h1></div><span class="tag" id="dayTag">DAY 1 / 30</span></div>
<section class="card"><div class="section-head"><div><div class="muted">選択日の達成率</div><div class="big" id="score">0%</div></div><div style="text-align:right"><div class="muted" id="selectedLabel"></div><div class="hint" id="status"></div></div></div><div class="meter"><div class="fill" id="bar" style="width:0%"></div></div><div class="stats"><div><strong id="total">0</strong><span class="muted">完全達成日</span></div><div><strong id="streak">0</strong><span class="muted">連続達成</span></div><div><strong id="remaining">30</strong><span class="muted">残り日数</span></div></div></section>
<section class="card"><div class="section-head"><h2>30日カレンダー</h2><button class="small" id="todayBtn">今日へ</button></div><div class="calendar" id="calendar"></div><p class="hint">日付をタップするとその日の記録を編集できます。未来の日は編集できません。</p></section>
<section class="card"><div class="section-head"><h2>禁止事項を守れたか</h2><button class="small" id="editBan">編集</button></div><div id="bans"></div></section>
<section class="card"><div class="section-head"><h2>必須行動を実行したか</h2><button class="small" id="editHabit">編集</button></div><div id="habits"></div></section>
<section class="card"><h2>誘惑・気づきの記録</h2><div class="muted" style="margin-bottom:8px">欲求の強さ（0〜10）</div><div class="row"><input type="range" min="0" max="10" id="urge" style="flex:1;accent-color:#7dd3a7"><strong id="urgeNum">0</strong></div><textarea id="note" placeholder="何がきっかけだった？どう対応した？"></textarea><button class="primary" id="save">今日の記録を保存</button><div id="saved" class="hint" style="margin-top:8px"></div></section>
<section class="card"><h2>チャレンジ設定</h2><label class="muted" for="start">開始日</label><input type="date" id="start" style="margin:7px 0 12px"><div class="toolbar"><button id="export">記録をバックアップ</button><button id="importBtn">バックアップを復元</button><button id="reset" class="danger">全記録を初期化</button></div><input type="file" id="importFile" accept="application/json" class="hidden"><p class="hint">記録はこのブラウザ内に保存されます。ブラウザデータ削除や機種変更に備え、定期的にバックアップしてください。</p></section><footer>完璧さより、正確な記録と継続を。</footer></main>
<script>
const KEY='monk-mode-30-v1';const localDay=(d=new Date())=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};const parseDay=s=>new Date(s+'T12:00:00');const add=(s,n)=>{let d=parseDay(s);d.setDate(d.getDate()+n);return localDay(d)};const diff=(a,b)=>Math.round((parseDay(a)-parseDay(b))/86400000);const defaults={start:localDay(),bans:['飲酒しなかった','喫煙しなかった','ポルノを見なかった','無目的なSNS・ショート動画を見なかった','衝動的なトレードをしなかった'],habits:['瞑想をした','読書・学習をした','計画した運動または回復を行った','就寝ルールを守った'],days:{}};let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=structuredClone(defaults)};let selected=localDay();const $=id=>document.getElementById(id);const saveState=()=>localStorage.setItem(KEY,JSON.stringify(state));const canEdit=()=>diff(selected,localDay())<=0&&diff(selected,state.start)>=0&&diff(selected,state.start)<30;const entry=date=>state.days[date]||{checks:{},urge:0,note:''};const items=()=>[...state.bans.map((x,i)=>['b'+i,x]),...state.habits.map((x,i)=>['h'+i,x])];const score=date=>{const it=items();if(!it.length)return 0;const e=entry(date);return Math.round(it.filter(([k])=>e.checks[k]).length/it.length*100)};const complete=date=>items().length>0&&score(date)===100;function render(){const today=localDay();const idx=diff(today,state.start);if(diff(selected,state.start)<0||diff(selected,state.start)>29)selected=idx<0?state.start:idx>29?add(state.start,29):today;const e=entry(selected);$('dayTag').textContent=`DAY ${Math.max(1,Math.min(30,idx+1))} / 30`;$('selectedLabel').textContent=selected;$('score').textContent=score(selected)+'%';$('bar').style.width=score(selected)+'%';$('status').textContent=canEdit()?'記録できます':'閲覧のみ';$('remaining').textContent=Math.max(0,30-Math.max(0,idx+1));let total=0,streak=0;for(let i=0;i<30&&i<=idx;i++)if(complete(add(state.start,i)))total++;for(let i=Math.min(idx,29);i>=0;i--){if(complete(add(state.start,i)))streak++;else break}$('total').textContent=total;$('streak').textContent=streak;$('calendar').replaceChildren();for(let i=0;i<30;i++){const date=add(state.start,i),b=document.createElement('button');b.className='day'+(date===today?' today':'')+(date===selected?' selected':'')+(diff(date,today)>0?' future':complete(date)?' full':state.days[date]?' partial':'');b.textContent=i+1;b.title=date;b.onclick=()=>{selected=date;render()};$('calendar').append(b)}for(const [id,arr,prefix] of [['bans',state.bans,'b'],['habits',state.habits,'h']]){const root=$(id);root.replaceChildren();arr.forEach((label,i)=>{const line=document.createElement('label');line.className='item';const check=document.createElement('input');check.type='checkbox';check.checked=!!e.checks[prefix+i];check.disabled=!canEdit();check.onchange=()=>{const x=entry(selected);x.checks[prefix+i]=check.checked;state.days[selected]=x;saveState();render()};const span=document.createElement('span');span.textContent=label;line.append(check,span);root.append(line)})}$('urge').value=e.urge??0;$('urgeNum').textContent=e.urge??0;$('note').value=e.note||'';$('urge').disabled=!canEdit();$('note').disabled=!canEdit();$('save').disabled=!canEdit();$('start').value=state.start}
$('urge').oninput=()=>$('urgeNum').textContent=$('urge').value;$('save').onclick=()=>{if(!canEdit())return;const e=entry(selected);e.urge=Number($('urge').value);e.note=$('note').value;state.days[selected]=e;saveState();$('saved').textContent='保存しました';render()};$('todayBtn').onclick=()=>{selected=localDay();render()};function edit(which){const name=which==='bans'?'禁止事項':'必須行動';const raw=prompt(name+'を1行につき1項目で編集してください。既存項目の順番を変えると過去のチェックとの対応が変わるため、追加は末尾にしてください。',state[which].join('\n'));if(raw===null)return;const arr=raw.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,30);if(!arr.length){alert('最低1項目は必要です');return}if(!confirm('項目を変更します。過去のチェックにも影響する場合があります。続けますか？'))return;state[which]=arr;saveState();render()}$('editBan').onclick=()=>edit('bans');$('editHabit').onclick=()=>edit('habits');$('start').onchange=()=>{if(!confirm('開始日を変更しますか？既存の記録は日付に紐づいたまま残ります。')){render();return}state.start=$('start').value;selected=state.start;saveState();render()};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='monk-mode-backup-'+localDay()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async ev=>{const file=ev.target.files[0];if(!file)return;try{const x=JSON.parse(await file.text());if(typeof x.start!=='string'||!Array.isArray(x.bans)||!Array.isArray(x.habits)||typeof x.days!=='object'||!x.days)throw Error();if(!confirm('現在のデータをバックアップ内容で上書きしますか？'))return;state=x;selected=localDay();saveState();render();alert('復元しました')}catch{alert('バックアップ形式を確認してください')}};$('reset').onclick=()=>{if(!confirm('すべての記録を消去します。元に戻せません。続けますか？'))return;if(!confirm('本当に初期化しますか？'))return;state=structuredClone(defaults);selected=localDay();saveState();render()};render();
</script><script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Offline setup unavailable', err))); }</script></body></html>
